name: GUCCI Railway CI
on:
  push:
    branches: [railway]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate scripts and branding
        run: |
          sh -n gucci/entrypoint.sh
          sh -n gucci/bootstrap-inbound.sh
          grep -q 'ساخته شده توسط تیم' gucci/landing/index.html
          ! grep -q 'href="/gucci/"' gucci/landing/index.html
          grep -q 'ghcr.io/mhsanaei/3x-ui:' Dockerfile.railway
      - name: Build Railway image
        run: docker build -f Dockerfile.railway -t gucci-3x-ui:test .
