name: GUCCI Railway CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate scripts and branding
        run: |
          sh -n gucci/entrypoint.sh
          grep -q 'ساخته شده توسط تیم' gucci/landing/index.html
          grep -q 'href="/gucci/enter"' gucci/landing/index.html
          grep -q '/gucci-assets/gucci-bg.webp' gucci/landing/index.html
          grep -q 'location /gucci-connect/ws' gucci/nginx.conf.template
          grep -q 'XUI_DATA_ROOT=/GUCCI' Dockerfile.railway
          grep -q 'XUI_DB_FOLDER=/GUCCI/x-ui' Dockerfile.railway
          grep -q 'XUI_DATA_ROOT:-/GUCCI' gucci/entrypoint.sh
          grep -q '<span className="brand-text">GUCCI</span>' frontend/src/layouts/AppSidebar.tsx
          grep -q '<span className="drawer-brand">GUCCI</span>' frontend/src/layouts/AppSidebar.tsx
          grep -q '<span className="brand-name">GUCCI</span>' frontend/src/pages/login/LoginPage.tsx
          ! grep -q '>3X-UI<' frontend/src/layouts/AppSidebar.tsx frontend/src/pages/login/LoginPage.tsx
          test -s gucci/landing/assets/gucci-bg.webp
          test -s gucci/landing/assets/favicon.svg
          test $(wc -c < gucci/landing/index.html) -lt 50000
          grep -q 'node:24-alpine AS frontend' Dockerfile.railway
          grep -q 'golang:1.26-alpine AS builder' Dockerfile.railway
          grep -q 'XRAY_COMPAT_VERSION=v26.6.27' Dockerfile.railway
          grep -q 'b3e5902d06d6282fe53cfa2fc426058b9aeaa429b2c812e20887cd47f26d08bf' Dockerfile.railway
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Audit documentation dependencies
        working-directory: docs
        run: npx -y pnpm@11.15.1 audit --audit-level=low
      - name: Build Railway image from full source
        run: docker build -f Dockerfile.railway -t gucci-3x-ui:test .
