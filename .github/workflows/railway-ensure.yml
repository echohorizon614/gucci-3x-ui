name: Enforce GUCCI Railway networking
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gucci-railway-networking
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce domain, TCP 1234 and Netherlands region
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          GUCCI_RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          GUCCI_RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          GUCCI_RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: bash scripts/railway-ensure.sh
