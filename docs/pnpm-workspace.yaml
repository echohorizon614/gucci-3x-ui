allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# Keep vulnerable transitive documentation dependencies on patched releases.
overrides:
  'brace-expansion@<2.0.0': '^1.1.18'
  'brace-expansion@>=4.0.0 <5.0.9': '^5.0.9'
  'dompurify@<=3.4.12': '^3.4.13'
  'js-yaml@>=4.0.0 <4.3.1': '^4.3.1'
  'nanoid@<3.3.18': '^3.3.18'
  'postcss@<=8.5.22': '^8.5.23'
  'sharp@<0.35.0': '^0.35.3'
minimumReleaseAgeExclude:
  - '@mermaid-js/parser@1.2.0'
  - mermaid@11.16.1
